    link: https://icbinb-bio.github.io/
    date: 2026-08-29
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/ICBINB-BIO
    note: >-
      PRISM's primary target. Native fit: the repetition-collapse and spurious-
