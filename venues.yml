  - name: ISMRM 2027 — abstract submission (route to the oral)
    link: https://www.ismrm.org/27m/
    date: 2026-10-28
    goal: true
    kind: curated
    track: Clinical
    no_feed: true
    pin_date: true
    fit:
      - project: cortseer
        strength: strong
        why: >-
          MR imaging is CortSeer's home discipline and ISMRM is its flagship
          meeting — the strongest clinical-imaging venue on the board.
      - project: clera
        strength: weak
        why: ISMRM is MR-specific; EEG work does not fit.
    note: >-
      CONFIRMED: "Abstract Submission Deadline: 28 October 2026". Meeting is
      08-13 May 2027, Vancouver. Acceptance notices go out in FEBRUARY.
      HOW ORALS ARE ACTUALLY CHOSEN — this is your goal, so it is worth knowing
      the mechanism rather than just writing a good abstract:
      (1) YOU MUST REQUEST IT. At submission you "rank your preferred presentation
      format, including oral presentation" — tables look at "the best-scoring
      abstracts that requested an oral presentation", so not requesting one filters
      you out before scores matter.
      (2) SCORE IS NECESSARY, NOT SUFFICIENT. Assignment happens at the AMPC
      meeting in January, where ~12 category tables build THEMED sessions: "The
      responsibility is to make the best oral sessions, not to simply assemble the
      best-scored abstracts." A high-scoring abstract that fits no theme becomes a
      poster — they say so outright.
      (3) THEMATIC FIT AND GROUP DIVERSITY ARE TIEBREAKERS: "We strive to have as
      many different research groups represented as practically possible in each
      oral session." Framing your abstract so it obviously belongs in a session
      someone would build ("Epilepsy", "Lesion Detection") beats framing it as a
      standalone result.
      (4) CATEGORY CHOICE PICKS YOUR REVIEWERS — "Selection of the subject category
      determines the expertise of the reviewers who score the abstract."
      (5) An oral slot is 9 minutes; scope the work to fit one.
      Acceptance overall runs 70-80%. Separately, Trainee abstracts scoring in the
      top 5% or 15% of a category get summa or magna cum laude, awarded on score
      alone and independent of whether you get a talk.

