  - name: NeurIPS DevAI 2026 — extended abstracts (non-archival)
    kind: workshop
    fit:
      - project: biocl
        strength: strong
        why: >-
          The intended target. Non-archival preserves ICLR, and Critical-Period
          Dale plus the conv-reinit fix is exactly a developmental-perspectives
          story.
    link: https://sites.google.com/view/devai-workshop-2026/important-dates
    date: 2026-10-13
