        strength: strong
        why: >-
          A 150-word poster abstract and one of the four themes is AI x Bio. The
          SBS17a to PF17041 headline is already a one-paragraph story.
      - project: cortseer
        strength: moderate
        why: >-
          Bioengineering framing fits, but the imaging work is a weaker match for
          the omics-heavy themes.
    link: https://biohub.org/events/chicago-bioengineering-conference-2026/
    date: 2026-07-31
    track: Bioengineering
    no_feed: true
    pin_date: true
    note: >-
      Confirmed: "All abstracts must be submitted by July 31; submissions received
      after this deadline will not be considered." Poster only, 150 words or fewer,
      no time-of-day published — so treat it as end of the working day. One of the
      four themes is AI x Bio. Poster session Sept 17, Sheraton Grand Chicago.
      A 150-word abstract is the cheapest submission on this whole board.

