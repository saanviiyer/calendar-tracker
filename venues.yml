    link: https://sites.google.com/view/devai-workshop-2026/important-dates
    date: 2026-08-29
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/DevAI
    note: >-
      ARCHIVAL track — 23:59 AoE. Archival publication would block a later ICLR
