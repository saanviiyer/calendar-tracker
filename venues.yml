    link: https://agenticls.github.io/
    date: 2026-09-16
    track: NeurIPS workshop
    no_feed: true
    pin_date: true
    openreview: NeurIPS.cc/2026/Workshop/AgenticLS
    labs: [OpenAI, Genentech, Roche, BioMap]
    labs_note: >-
      Verified by hand 2026-07-31 — the deepest SENIOR-industry roster of any
