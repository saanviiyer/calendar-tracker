          Clinical EEG is in scope for PSB, but there are no results to write up.
    link: https://psb.stanford.edu/callfor/papers/
    date: 2026-08-03
    track: Comp bio
    no_feed: true
    pin_date: true
    note: >-
      11:59 PM PT and the page says "All deadlines are firm. No extensions." Your
