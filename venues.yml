# Venues tracked on the deadline board.
#
# This file is the hand-maintained source of truth. `scrape.py` reads it, then
# tries to improve each entry from the ccfddl and huggingface/ai-deadlines
# feeds, and writes deadlines.json. Edit here, never in deadlines.json.
#
# Per-venue keys:
#   name        display name (required)
#   link        CFP or important-dates page
#   date        YYYY-MM-DD. Omit if unknown.
#   approx      true when `date` is a guess at the month rather than the day
#   track       grouping label shown on the board
#   note        free text; the scraper appends its findings to this
#   match       feed titles to look up. Defaults to `name`.
#   no_feed     true for venues no aggregator covers — skips the lookup
#   pin_date    keep `date` even if a feed disagrees; the difference is noted
#   probe       with `--probe`, fetch `link` and try to read a date off the page
#   labs        industry labs among the organizers and speakers. Hand-written
#               entries are verified rosters; `--labs` also fills this in
#               automatically for discovered workshops, badged "auto-read".
#   labs_note   who specifically, and in what role. Worth writing by hand — a
#               DeepMind sponsor logo and a DeepMind intern are not the same news.
#
# Research areas driving the venue selection: EEG and neuroimaging, cortical
# parcellation, computational neuroscience, bio-plausible continual learning,
# protein and molecular ML, health and clinical AI, HCI, NLP.

# Deadlines are reported in this timezone. OpenReview stores exact instants, so
# a deadline set at "Aug 29 AoE" surfaces here as the local wall-clock moment.
timezone: America/Los_Angeles

# Your projects. Each venue gets a "best fit" chip on the board, either from an
# explicit `fit:` on the venue or, failing that, by matching these keywords
# against the venue name. Explicit always wins — keyword matching is only there
# so auto-discovered workshops aren't left blank.
# `readiness` drives the odds estimate as much as the venue does — a selective
# venue with a finished paper beats a friendly one with nothing written.
#   ready    a draft with real numbers exists now
#   partial  results exist, writing or a blocker outstanding
#   early    no results yet; submitting would mean starting from scratch
projects:
  gauntlet:
    name: Gauntlet
    blurb: auditing whether protein-design fitness proxies measure the biology they claim to
    readiness: ready
    readiness_note: >-
      Phase 1 landed on real data — ESM-2 650M zero-shot ranks measured PET-hydrolase activity
      at within-study rho = +0.007 across 504 variants, losing outright to a bare mutation count.
      Two workshop papers drafted (Verify-Agents 6pp, AI4Science Verification 5pp) for the Aug 29
      and Aug 30 deadlines. Open: the two-dataset generalization (RuBisCO DMS + SSMuLA) gated to
      Aug 20, and the proto-language contribution that feeds the Arc AIxBio application.
    keywords:
      - protein
      - enzyme
      - molecul
      - chem
      - bio
      - sequence
      - benchmark
      - evaluat
      - verif
      - discovery
  prism:
    name: PRISM
    blurb: COSMIC signatures, ESM-2 drift toward Pfam centroids, genomic-LLM failure modes
    readiness: partial
    readiness_note: >-
      Three papers drafted with real numbers (ICBINB 6pp, SIMBIOCHEM 4pp, MoML 4pp)
      and Overleaf zips built. Downgraded from ready 2026-08-11: the Proto rerun
      shows a composition-matched arm ties or beats the signature arm (0.0764 vs
      0.0736), so the 3.4x design-loop result is base composition and not the
      mutational process. Abstracts in ml4molecules and sim2science asserted the
      opposite and were corrected. Open: Evo2 needs an A100, the SIMBIOCHEM
      structural readout needs the ESMFold pilot re-run, and an amino-acid
      frequency regression is pending that would tell us whether the external
      Pfam-oracle confirmation inherits the same composition confound.
    keywords: [protein, molecul, chem, genom, omics, drug, bio, sequence, simulat, discovery, spatial]
  clera:
    name: CLERA
    blurb: Regional localization of EEG abnormalities, clinical
    readiness: early
    readiness_note: >-
      Design document and evaluation protocol exist, TUSZ was still downloading,
      no localization results yet. Anything before roughly October means writing
      from scratch against an unfinished model.
    keywords: [eeg, bci, brain, signal, epilep, clinic]
  biocl:
    name: biocl
    blurb: Critical-Period Dale, bio-plausible continual learning and loss of plasticity
    readiness: ready
    readiness_note: >-
      Extended abstract drafted; full diagnosis-plus-fix arc reproduces on both
      Split-CIFAR-10 and FashionMNIST. Includes a clean negative (critical-period
      scheduling fails), which suits workshops and hurts at main tracks.
    keywords: [continual, lifelong, forget, plastic, developmental, curricul]
  cortseer:
    name: CortSeer
    blurb: FCD lesion localization from MRI, nnU-Net probability maps
    readiness: partial
    readiness_note: >-
      Results are solid and the insula reassignment is recomputed, so abstracts are
      easy. The unresolved top-3 to top-4 framing change still needs a decision
      before any full paper.
    keywords: [imaging, radiolog, mri, segment, patholog, diagnos]
  deejai:
    name: deejai
    blurb: Agentic web DAW for vocal production
    readiness: early
    readiness_note: >-
      A working system, but no user study and no evaluation. HCI venues review
      studies, not artifacts, so a submission would need one built first.
    keywords: [interface, interaction, creativ, audio]
  igbot:
    name: science-IG-bot
    blurb: Automated science-communication pipeline
    readiness: early
    readiness_note: >-
      Pipeline works but is unevaluated, and the accounts do not exist yet. No
      research claim to defend without a study of what the output does.
    keywords: [communicat, outreach, responsible]

# How selective a venue is, which sets the ceiling on the odds estimate.
#   curated    abstracts/posters screened for scope, rarely rejected outright
#   workshop   peer-reviewed but broad; most on-topic work with real results gets in
#   selective  competitive archival venue, a strong minority of submissions accepted
#   toptier    main tracks of the big conferences, roughly a quarter accepted
venue_kinds:
  curated:       {label: "curated / poster",    base: likely}
  workshop:      {label: "workshop review",     base: likely}
  selective:     {label: "competitive",         base: plausible}
  toptier:       {label: "top-tier main",       base: longshot}
  student_prize: {label: "student prize",       base: plausible}
  fellowship:    {label: "national fellowship", base: longshot}
  internship:    {label: "research internship", base: plausible}
  outreach:      {label: "outreach",            base: likely}
  phd:           {label: "PhD application",     base: plausible}

# Workshops inside big conferences: every accepted NeurIPS/ICLR/ICML workshop
# registers a submission invitation on OpenReview carrying an exact due date,
# usually weeks before its own website is finished. The scraper walks those
# listings and keeps workshops whose name or title matches `keywords`. Add a
# conference year here as soon as it opens and new workshops appear on their own.
workshop_discovery:
  # Only conferences still ahead of us. ICLR/ICML 2026 already happened, and
  # OpenReview rejects lookups against their expired submission invitations.
  # The 2027 entries are empty today and fill themselves in as workshops are
  # accepted — that is the point of listing them early.
  domains:
    - NeurIPS.cc/2026
    - ICLR.cc/2027
    - ICML.cc/2027
    - NeurIPS.cc/2027
  keywords:
    # biology, chemistry, molecules
    - bio
    - chem
    - molecul
    - protein
    - drug
    - genom
    - omics
    - spatial
    # brain, neuro, cognition
    - neuro
    - brain
    - eeg
    - bci
    - cognit
    # health and clinic
    - health
    - clinic
    - medic
    - patholog
    - diagnos
    # learning dynamics relevant to the critical-period / continual work
    - continual
    - lifelong
    - forget
    - plastic
    - developmental
    # failure modes, robustness, interpretability
    - icbinb
    - believe
    - failure
    - interpret
    # multimodal grounding
    - vision-language
    - vlm
    - grounded
    # science-of-ML
    - discovery
    # Added 2026-07-31 after a manual sweep of all 100 NeurIPS 2026 workshops found
    # three strong fits that title keywords alone had missed. "AI for Science
    # Workshop: Verification in the Age of AI Scientists" and "Sim2Science: ML with
    # Imperfect Scientific Models" contain none of the words above, yet the first is
    # the least selective workshop on the board and the second is the only one Google
    # DeepMind sponsors. The lesson: match the *methodology* vocabulary too, not just
    # the subject matter.
    - science
    - scientific
    - simulat
    - verif
    - reproduc
    - falsifi
    - measurement
    - agentic
    - benchmark
  exclude_keywords:
    - queer in ai
    - lxai
    - africa in ai
    - global south
    - music
    - game
    - law
    - finance
    - robot

venues:

  # ---------------------------------------------------------------- on the
  # original list, dates you supplied
  - name: Biohub Chicago Bioengineering Conference
    kind: curated
    fit:
