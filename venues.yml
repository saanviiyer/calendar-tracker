# ---------------------------------------------------------------------------
# Awards, fellowships and student prizes. These share the board's timeline with
# paper deadlines on purpose — a nomination deadline is easier to miss than a
# submission deadline, and it usually lands earlier.
#
# Eligibility is quoted as close to the source as possible. Several of these are
# gated on being a MEDICAL trainee (resident/fellow/med student) or on holding a
# paid society membership BEFORE you apply — both are noted per entry.
awards:

  - name: ASPNR 2027 — Travel Awards (5 separate awards)
    link: https://aspnr.org/meetings/aspnr-annual-meeting/aspnr2027/
    date: 2026-09-18
    kind: student_prize
    track: Award
    fit:
      - project: cortseer
        strength: strong
        why: >-
          Same day as the ASPNR abstract you are already tracking, and the FCD
          work is squarely pediatric neuroradiology. Apply alongside the abstract.
    eligibility: >-
      All five require an accepted abstract. Most are for medical trainees, but the
      Erin & Darren Schwartz Research Scientist Travel Grant is explicitly for
      early-career RESEARCH SCIENTISTS WITHOUT AN MD — that is the one to read
      first. Booth-Johnson is medical students; Silvera/Heist is radiology
      residents and neuroradiology fellows; Palasis/Philbrook is international
      trainees from low and lower-middle income countries.
    award: >-
      Travel reimbursement, capped by award: up to $3,000 (international), $2,000
      (Silvera/Heist and Schwartz Research Scientist), $1,000 (Booth-Johnson).
    note: >-
      The award application and the abstract share Sept 18 but are SEPARATE
      submissions — file both. The award is contingent on the abstract being
      accepted afterwards. 9th Annual Meeting, January 2027, Miami Beach.

  - name: PSB 2027 — Travel Award
    link: https://psb.stanford.edu/keydates/
    date: 2026-10-15
    kind: student_prize
    track: Award
    fit:
      - project: prism
        strength: strong
        why: >-
          Timing is unusually kind: paper decisions land Sept 8, so you will
          already know whether the Aug 3 submission was accepted before applying.
    eligibility: >-
      No society membership required and an accepted paper is not stated as
      mandatory, though PSB has historically prioritised presenters. PSB is blunt
      that "no one is guaranteed travel support".
    award: Partial travel support only; PSB does not publish amounts.
    note: >-
      Applications open Aug 3 2026 and close Oct 15 at 11:59 PM PT, decisions late
      October. Note the ordering trap: the poster route closes Dec 1, AFTER this
      travel deadline, so a poster-only attendee must apply for travel first.

  - name: CHI 2027 — Student Research Competition
    link: https://chi2027.acm.org/authors/student-research-competition/
    date: 2027-01-21
    kind: student_prize
    track: Award
    fit:
      - project: deejai
        strength: moderate
        why: >-
          The SRC is a standalone 5-page submission, NOT an add-on to an accepted
          paper — so deejai can enter without the full user study a CHI paper needs.
      - project: clera
        strength: weak
        why: Eligible in principle, but CHI's audience is interaction, not clinical signal processing.
    eligibility: >-
      Must be enrolled at the time of the submission deadline. UNDERGRADUATES may
      submit individually OR as a team; graduate students must be sole authors.
      Advisors cannot be co-authors. ACM student membership required only if
      selected. Proof of student status required. In-person attendance required.
    award: >-
      Poster slot at CHI 2027, then $500 / $300 / $200 for the top three in each of
      the undergraduate and graduate categories, plus a medal, a year of ACM student
      membership, and first place advances to the ACM SRC Grand Finals.
    note: >-
      This confirms the separate January deadline on your original list. Wholly
      independent of the CHI Papers deadline: submit Jan 21, notified Feb 18,
      publication-ready Mar 18. Travel is not included — CHI runs a separate Gary
      Marsden Travel Award.

  - name: RSNA 2026 — Trainee Research Prize
    link: https://www.rsna.org/annual-meeting/awards-recognition/trainee-research-prize
    date: 2026-08-05
    kind: student_prize
    track: Award
    fit:
      - project: cortseer
        strength: moderate
        why: >-
          Rides on the Aug 5 Cutting-Edge Research abstract you are already
