# ---------------------------------------------------------------------------
# People to contact, and when to follow up.
#
# No email account is wired into this tool, so nothing here is read from your
# inbox — you record when you last wrote to someone and the board computes the
# next nudge as last_contacted + cadence_days. Set `last_contacted` in the row's
# drawer as you go; leave it blank and the board shows `first_contact_by` instead.
#
#   first_contact_by  target date for the first email, if you have not written yet
#   cadence_days      how long to wait before a follow-up
#   last_contacted    YYYY-MM-DD of your last message (usually edited in the UI)
outreach:

  - name: CliMem organizer — send review and decision
    kind: outreach
    track: Outreach
    first_contact_by: 2026-07-31
    cadence_days: 3
    note: >-
      Owed: your review plus your decision on the paper. A scheduled reminder is
      set for 9am on Jul 31. Short cadence because a review owed to an organizer is
      blocking someone else's timeline, not just yours — if it slips, chase it in
      three days rather than three weeks. Set "last contacted" once sent.
  - name: Adrienne Fairhall (UW) — introduction
    person: Adrienne Fairhall
    affiliation: University of Washington — computational neuroscience
    link: https://faculty.washington.edu/fairhall/
    kind: outreach
    track: Outreach
    first_contact_by: 2026-08-14
    cadence_days: 21
    fit:
      - project: biocl
        strength: strong
        why: >-
          Adaptation and plasticity in neural coding is her area, and the
          Critical-Period Dale result — that a biological constraint induces
          accumulated loss of plasticity — is a concrete question to open with.
      - project: clera
        strength: moderate
        why: Neural coding and dynamics background is relevant to EEG localization.
    note: >-
      You flagged this one yourself. Best opening is the specific negative result
      rather than a general introduction: static Dale learns tasks 0-1 then sits at
      chance, a fresh Dale net learns task 2 fine, so it is genuine loss of
      plasticity rather than an implementation artifact. That is a real question,
      not a request for time. Send BEFORE the Oct 13 DevAI deadline so any reply can
      shape the abstract. If nothing comes back in three weeks, one short follow-up,
      then leave it.

  - name: AITHYRA / Gabriela Lobinska — PRISM submission check-in
    person: Gabriela Lobinska
    affiliation: AITHYRA, Vienna
    kind: outreach
    track: Outreach
    first_contact_by: 2026-08-07
    cadence_days: 10
    fit:
      - project: prism
        strength: strong
        why: Your PRISM co-author; three papers are due in the same 48 hours.
    note: >-
      Time-critical rather than optional. Before Aug 29 you need agreement on
      author order across all three papers, a decision on whether ICBINB ships
      without Evo2 if A100 access does not materialise, and who re-runs the ESMFold
      pilot for SIMBIOCHEM. Tighter cadence here because the deadline is fixed.

