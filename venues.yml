    fit:
      - project: cortseer
        strength: moderate
        why: Clinical-impact imaging foundation models; pathology rather than MRI, so adjacent not aligned.
    note: >-
      DATE UNVERIFIED AGAINST THE WORKSHOP'S OWN SITE — asci.artificialintelligencepathology.org
      returns HTTP 403 to automated fetching, so Aug 19 comes from OpenReview alone
      and no second track could be ruled out. Open it in a browser before relying
      on it; it is the earliest of the NeurIPS workshop cluster by ten days, which
      is unusual enough to be worth confirming.
  - name: NeurIPS SIMBIOCHEM 2026 — Simulations for Biology and Chemistry
    kind: workshop
    fit:
      - project: prism
        strength: moderate
        why: >-
          The stretch venue: the workshop is MD, force-field and free-energy
          centric, so COSMIC-as-simulator needs the structural readout to be
          legible. simbiochem_prism.tex is drafted but the ESMFold pilot is still
          pending.
    link: https://www.simbiochem.com/
    date: 2026-08-29
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/Simbiochem
    note: >-
      2nd edition, Sydney, Dec 11. The site states 11:59 PM UTC, which is NOT
      Anywhere-on-Earth — you lose most of a day versus the usual AoE cutoff.

  - name: NeurReps 2026 — Symmetry and Geometry in Neural Representations
    kind: workshop
    fit:
      - project: biocl
        strength: moderate
        why: >-
          Fits the LOCALITY study, not the Dale paper — and only after a reframe.
          What belongs here is the mechanism dissociation (end-of-stream effective
          rank 1.4 dfa to 8.9 pc of 256 units, gradient alignment varying tenfold,
          forgetting indifferent to both) and the sparsity result (BWT tracks the
          active fraction and nothing else, -13 at 0.5% active to -83 at dense).
          Geometry has to become the object and forgetting the readout; submitting
          the Dale paper as written reads as a continual-learning paper that
          happens to compute effective rank. NOTE the strongest geometry angle —
          depth-dependent rank collapse under sign constraints — is already CLOSED
          by Jacot, Timor, Daneshmand, Dong and Shin & Yun, and the corrected v3
          run shows the depth trend is not constraint-specific. Resolve first why
          Dale gives dead-unit fraction 1.00 while the local rules give 0.000 with
          rank collapse anyway; that contrast is either the contribution or the
          confusion.
    link: https://neurreps.org/
    date: 2026-08-23
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/NeurReps_Extended_Abstracts
    labs: [Google DeepMind, Goodfire, NTT Research, Bayer]
    labs_note: >-
      Verified by hand 2026-07-31. Mikhail Galkin (Google DeepMind) speaks, with
      Ekdeep Lubana (Goodfire) and Hidenori Tanaka (NTT Research) on the geometry
      and neuroscience panel; Alison Pouplin (Bayer AG) organizes. Thinner than
      the AI-for-science venues, but a 5th edition means a real track record.
    note: >-
      EARLIEST NeurIPS DEADLINE YOU ARE CONSIDERING — Aug 22 AoE, eight days ahead
      of the CL4FMAgents and DevAI cluster. THREE TRACKS, one deadline, and the
      choice matters: this row is the 4-page EXTENDED ABSTRACT track, non-archival,
      which is the one that protects ICLR 2027. The PROCEEDINGS track (9pp) goes to
      a PMLR volume — archival, and it would foreclose the locality paper. A new
      FINDINGS track has no page limit and is single-blind, editorially reviewed,
      pitched at Cell/Nature/Science-caliber work; not your route. Sydney, Dec
      11-12. No sponsors and no area chairs announced yet.

  - name: NeurIPS AI4Science 2026 — Verification in the Age of AI Scientists
    kind: workshop
    fit:
      - project: prism
        strength: strong
        why: >-
          The theme is verification, and PRISM's strongest material is verification
          work: the duplicate-row self-audit (4104 hits to 2241), the hub-confound
          control (48x/61x enrichment against a 0.7% baseline), and the LOSO negative
          showing the 0.937 AUC was seen-signature memorization. That is a paper
          about how you check an AI scientist's claims, which is the stated topic.
    link: https://ai4sciencecommunity.github.io/neurips26.html
    date: 2026-08-30
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/AI4Science
    labs: [Google DeepMind, Microsoft Research]
    labs_note: >-
      Confirmed against the workshop site 2026-07-31. Emilien Dupont (Google
      DeepMind) and Yuanqi Du (Microsoft Research) organize, alongside Marinka
      Zitnik (Harvard) and Priya Donti (MIT); Adam Zsolt Wagner (Google DeepMind)
      gives the AI-for-Mathematics talk; Rianne van den Berg (Microsoft Research)
      sits on the verification-gap panel with David Rolnick.
    note: >-
      HIGHEST ACCEPTANCE ODDS ON THE BOARD. 7th edition of the AI for Science
      series; the 2025 edition put roughly 401 posters on the NeurIPS virtual
      schedule, and the organizers' own FAQ concedes the volume problem. 4-8 pages
      with unlimited references and appendices, NeurIPS 2026 template, NO checklist
      needed, footnote must be changed to name the workshop. Non-archival — accepted
      papers are posted on the site only. Sydney, Dec 11 or 12, so it DOES combine
      with ICBINB-BIO and SIMBIOCHEM in one trip (Sim2Science does not — that one is
      Paris). ABSTRACT GATE: the FAQ confirms one exists and that it only requires
      creating the OpenReview submission tab, but no date for it is published in
      the dates list, so open the OpenReview group early rather than assuming you
      can start on the 29th. Site says submission Aug 29 AoE while the OpenReview
      invitation closes Aug 30 23:59 UTC, about twelve hours later; trust the
      earlier one. Rebranded from the generic AI for Science title — the 2026 theme
      is verification, which is why PRISM's self-audit and LOSO negative fit.

  - name: NeurIPS Sim2Science 2026 — ML with Imperfect Scientific Models
    kind: workshop
    fit:
      - project: prism
        strength: strong
        why: >-
          "Imperfect scientific models" describes PRISM almost literally: COSMIC
          signatures as an imperfect generative model of mutation, plus the S669
          result showing the ESM-2 masked-LM ddG proxy is directionally right
          (rho -0.11 at 8M, -0.25 at 650M) but quantitatively ungrounded. The
          measurement-validity angle is the paper.
    link: https://www.sim2science.com/
    date: 2026-08-30
    track: NeurIPS workshop
    no_feed: true
    openreview: NeurIPS.cc/2026/Workshop/Sim2Sci
    labs: [Google DeepMind, Hugging Face, CuspAI, Proxima Fusion]
    labs_note: >-
      Verified by hand 2026-07-31. The only NeurIPS 2026 workshop where Google
      DeepMind appears in all three roles at once: Noemi Elteto organizes, Pablo
      Samuel Castro speaks, and GDM is a confirmed SPONSOR alongside Hugging Face
      (whose Georgia Channing also organizes). Max Welling advises via CuspAI.
    note: >-
      Paris, Dec 12-13 — NOT Sydney, so it does not combine with ICBINB or
      SIMBIOCHEM in one trip. 5 pages, or 2 for a tiny paper; non-archival.
      Unusually permissive: reciprocal review, and recently published or
      under-review work is explicitly welcome, which makes this about as friendly
      as a workshop gets.

  - name: NeurIPS WiML 2026 — Women in Machine Learning
    kind: workshop
    fit:
      - project: prism
        strength: strong
        why: >-
          One-page abstract already drafted and compiled from the ICBINB
          failure-modes result (the metric-audit reframe): composition control,
          gameability, and the honest downgrade of SBS17a to a
          composition-associated embedding effect.
    link: https://www.wiml.org/
    date: 2026-08-17
    track: NeurIPS workshop
    no_feed: true
    pin_date: true
    openreview: NeurIPS.cc/2026/Workshop/WiML
    note: >-
      NEAREST DEADLINE ON THE BOARD. The OpenReview invitation is due
      2026-08-18 02:00 UTC and expires 02:30 UTC, which is 7:00pm PDT on
      Aug 17 — the date shown here is local, so do NOT read it as "all of
      Aug 18". Verified 2026-08-07 from the submission invitation itself
      (api2.openreview.net .../2026/Workshop/WiML/-/Submission), because the
      workshop site sits behind a Google login and the public CFP pages do
      not state the format. Requirements: 1 page; PDF only, .pdf, 50 MB cap;
      NO template or style file is required, so plain article is correct and
      must not be "upgraded" to a NeurIPS style; the submission checklist
      requires "I confirm that the submission is ANONYMOUS" — the draft is
      anonymized accordingly, and presenter identity is captured by the
      form's confirm_age field rather than the PDF. First or co-first author
      on AT MOST ONE WiML submission. Non-archival. Names are published only
      after the conference. Note the affinity-workshop eligibility rule: the
      presenter must identify as a woman or nonbinary adult.

  - name: NeurIPS AgenticLS 2026 — Agentic AI for Biological Discovery
    kind: workshop
    fit:
      - project: prism
        strength: strong
        why: >-
          The "Closed-Loop Discovery" track is a direct description of the Proto
